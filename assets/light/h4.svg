<svg xmlns="http://www.w3.org/2000/svg" width="840" height="64" viewBox="0 0 840 64" role="img">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Hiragino Sans', Helvetica, Arial, sans-serif;}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
</style>

<rect x="0" y="4" width="840" height="58" rx="10" fill="#ffffff"/>
<text x="8" y="34" class="mono" font-size="14" fill="#4f46e5">04</text>
<text x="40" y="35" class="sans" font-size="22" font-weight="700" fill="#1f2328">stack</text>
<line x1="128" y1="28" x2="834" y2="28" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="128" y1="28" x2="198" y2="28" stroke="#4f46e5" stroke-width="2.5">
  <animate attributeName="x1" values="128;764;128" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="198;834;198" dur="8s" repeatCount="indefinite"/>
</line>
<text x="40" y="55" class="mono" font-size="12.5" fill="#59636e">tools I work with</text>

