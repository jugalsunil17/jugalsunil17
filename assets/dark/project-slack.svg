<svg xmlns="http://www.w3.org/2000/svg" width="412" height="206" viewBox="0 0 412 206" role="img">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Hiragino Sans', Helvetica, Arial, sans-serif;}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
</style>

<rect x="1" y="1" width="410" height="194" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="20" y="38" class="sans" font-size="17.5" font-weight="700" fill="#e6edf3">Slack Watcher Agent</text>
<rect x="317.0" y="20" width="77.0" height="24" rx="12" fill="none" stroke="#30363d"/>

<text x="355.5" y="36" text-anchor="middle" class="mono" font-size="11.5" fill="#8d96a0">personal</text>
<text x="20" y="72" class="sans" font-size="14" fill="#8d96a0"><tspan x="20" dy="0">Polls Slack, a small Claude model triages each</tspan><tspan x="20" dy="20">message, a simple router picks the right model,</tspan><tspan x="20" dy="20">and an agent loop handles it with tools. Alerts</tspan><tspan x="20" dy="20">go to Telegram.</tspan></text>
<rect x="20.0" y="152" width="94.4" height="25" rx="12.5" fill="#1c2240" stroke="#3b4380"/><text x="67.2" y="168.8" text-anchor="middle" class="mono" font-size="12" fill="#818cf8">Claude API</text><rect x="121.4" y="152" width="87.0" height="25" rx="12.5" fill="#1c2240" stroke="#3b4380"/><text x="164.9" y="168.8" text-anchor="middle" class="mono" font-size="12" fill="#818cf8">Slack SDK</text><rect x="215.4" y="152" width="79.5" height="25" rx="12.5" fill="#1c2240" stroke="#3b4380"/><text x="255.1" y="168.8" text-anchor="middle" class="mono" font-size="12" fill="#818cf8">Telegram</text>

</svg>
