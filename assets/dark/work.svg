<svg xmlns="http://www.w3.org/2000/svg" width="840" height="742" viewBox="0 0 840 742" role="img">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Hiragino Sans', Helvetica, Arial, sans-serif;}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}
</style>

<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.000;1" dur="0.50s" fill="freeze"/>
<rect x="1.0" y="1" width="411.0" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="1.0" y="19" width="4" height="28" rx="2" fill="#818cf8"/>
<text x="23.0" y="41" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Agentic Marketing AI Platform</text>
<text x="23.0" y="71" class="sans" font-size="14.5" fill="#8d96a0"><tspan x="23.0" dy="0">Production multi-agent platform for an enterprise</tspan><tspan x="23.0" dy="21">marketing team: modular agent pipelines, one LLM</tspan><tspan x="23.0" dy="21">broker for Gemini, Claude and GPT-4o, RAG on</tspan><tspan x="23.0" dy="21">BigQuery and Vertex AI.</tspan></text>
<text x="23.0" y="177" class="mono" font-size="13" fill="#2dd4bf">14+ agent pipelines, in production</text>
<rect x="23.0" y="193" width="43.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="44.6" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">GCP</text><rect x="74.2" y="193" width="74.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="111.4" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">FastAPI</text><rect x="156.5" y="193" width="58.8" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="185.9" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">React</text><rect x="223.2" y="193" width="43.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="244.9" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">MCP</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.231;1" dur="0.65s" fill="freeze"/>
<rect x="428.0" y="1" width="411.0" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="428.0" y="19" width="4" height="28" rx="2" fill="#818cf8"/>
<text x="450.0" y="41" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Agentic HR Automation</text>
<text x="450.0" y="71" class="sans" font-size="14.5" fill="#8d96a0"><tspan x="450.0" dy="0">Multi-user agent that does sourcing, outreach and</tspan><tspan x="450.0" dy="21">pipeline work in a real logged-in browser for</tspan><tspan x="450.0" dy="21">recruiters, with human approval before anything is</tspan><tspan x="450.0" dy="21">sent.</tspan></text>
<text x="450.0" y="177" class="mono" font-size="13" fill="#2dd4bf">8 recruiters, 10 h/week saved</text>
<rect x="450.0" y="193" width="66.5" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="483.2" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Claude</text><rect x="524.5" y="193" width="43.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="546.1" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">ACP</text><rect x="575.8" y="193" width="43.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="597.4" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">MCP</text><rect x="627.0" y="193" width="43.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="648.6" y="210.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">CDP</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.375;1" dur="0.80s" fill="freeze"/>
<rect x="1.0" y="253" width="411.0" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="1.0" y="271" width="4" height="28" rx="2" fill="#818cf8"/>
<text x="23.0" y="293" class="sans" font-size="18" font-weight="700" fill="#e6edf3">GenAI Campaign Generator (PoC)</text>
<text x="23.0" y="323" class="sans" font-size="14.5" fill="#8d96a0"><tspan x="23.0" dy="0">Turns raw, unstructured event data into email</tspan><tspan x="23.0" dy="21">campaigns, subject-line variants and targeting.</tspan><tspan x="23.0" dy="21">The LLM writes copy only; every fact is checked in</tspan><tspan x="23.0" dy="21">Python.</tspan></text>
<text x="23.0" y="429" class="mono" font-size="13" fill="#2dd4bf">extract &gt; validate &gt; generate &gt; guardrail</text>
<rect x="23.0" y="445" width="66.5" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="56.2" y="462.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Claude</text><rect x="97.5" y="445" width="66.5" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="130.8" y="462.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Gemini</text><rect x="172.0" y="445" width="74.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="209.1" y="462.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">FastAPI</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.474;1" dur="0.95s" fill="freeze"/>
<rect x="428.0" y="253" width="411.0" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="428.0" y="271" width="4" height="28" rx="2" fill="#818cf8"/>
<text x="450.0" y="293" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Real-Time Speech Translation</text>
<text x="450.0" y="323" class="sans" font-size="14.5" fill="#8d96a0"><tspan x="450.0" dy="0">Streams live speech translation to the browser:</tspan><tspan x="450.0" dy="21">voice activity detection, Whisper Large V3 on MLX</tspan><tspan x="450.0" dy="21">and a 4-bit Llama 3 8B, plus a FAISS glossary for</tspan><tspan x="450.0" dy="21">business terms.</tspan></text>
<text x="450.0" y="429" class="mono" font-size="13" fill="#2dd4bf">400-900 ms latency threshold</text>
<rect x="450.0" y="445" width="97.5" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="498.8" y="462.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">WebSockets</text><rect x="555.5" y="445" width="74.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="592.6" y="462.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Whisper</text><rect x="637.8" y="445" width="74.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="674.9" y="462.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Llama 3</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.545;1" dur="1.10s" fill="freeze"/>
<rect x="1.0" y="505" width="411.0" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="1.0" y="523" width="4" height="28" rx="2" fill="#818cf8"/>
<text x="23.0" y="545" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Sales AI Agent Infrastructure</text>
<text x="23.0" y="575" class="sans" font-size="14.5" fill="#8d96a0"><tspan x="23.0" dy="0">Sole engineer on the AWS foundation for a</tspan><tspan x="23.0" dy="21">sales-automation agent platform: Terraform with</tspan><tspan x="23.0" dy="21">remote state, CI/CD with GitHub Actions and OIDC,</tspan><tspan x="23.0" dy="21">AI layer on Bedrock.</tspan></text>
<text x="23.0" y="681" class="mono" font-size="13" fill="#2dd4bf">solo build, infra as code</text>
<rect x="23.0" y="697" width="43.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="44.6" y="714.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">AWS</text><rect x="74.2" y="697" width="89.8" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="119.1" y="714.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Terraform</text><rect x="172.0" y="697" width="74.2" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="209.1" y="714.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Bedrock</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.600;1" dur="1.25s" fill="freeze"/>
<rect x="428.0" y="505" width="411.0" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="428.0" y="523" width="4" height="28" rx="2" fill="#818cf8"/>
<text x="450.0" y="545" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Retail Shelf Proposal AI</text>
<text x="450.0" y="575" class="sans" font-size="14.5" fill="#8d96a0"><tspan x="450.0" dy="0">Pipeline that turns social trends into weekly</tspan><tspan x="450.0" dy="21">store-shelf proposals with AI-generated images. I</tspan><tspan x="450.0" dy="21">work on requirements analysis and AI output</tspan><tspan x="450.0" dy="21">quality checks.</tspan></text>
<text x="450.0" y="681" class="mono" font-size="13" fill="#2dd4bf">ongoing</text>
<rect x="450.0" y="697" width="128.5" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="514.2" y="714.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Gemini 2.5 Pro</text><rect x="586.5" y="697" width="159.5" height="25.5" rx="12.8" fill="#1c2240" stroke="#3b4380"/><text x="666.2" y="714.2" text-anchor="middle" class="mono" font-size="12.5" fill="#818cf8">Gemini 3 Pro Image</text>
</g>
</svg>
