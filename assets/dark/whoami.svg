<rect x="1" y="1" width="838" height="422" rx="14" fill="#161b22" stroke="#30363d"/>
<path d="M1,15 a14,14 0 0 1 14,-14 H825 a14,14 0 0 1 14,14 V38 H1 Z" fill="#0d1117" stroke="#30363d"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="420.0" y="25" text-anchor="middle" class="mono" font-size="12.5" fill="#8d96a0">zsh: ~/about</text>
<text x="26" y="70" class="mono" font-size="13.5"><tspan fill="#2dd4bf">jugal@tokyo</tspan><tspan fill="#8d96a0"> ~ $ </tspan><tspan fill="#e6edf3" font-weight="700">whoami</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.000;1" dur="0.30s" fill="freeze"/></text><text x="26" y="94" class="mono" font-size="13.5"><tspan fill="#e6edf3">Jugal Sunil, AI Engineer at Akatsuki AI Technologies (Tokyo)</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="0.50s" fill="freeze"/></text><text x="26" y="118" class="mono" font-size="13.5"><tspan fill="#2dd4bf">jugal@tokyo</tspan><tspan fill="#8d96a0"> ~ $ </tspan><tspan fill="#e6edf3" font-weight="700">cat focus.txt</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="0.70s" fill="freeze"/></text><text x="26" y="142" class="mono" font-size="13.5"><tspan fill="#818cf8">&gt; </tspan><tspan fill="#e6edf3">Agentic AI: multi-agent pipelines, MCP tool servers, ACP, browser agents</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.667;1" dur="0.90s" fill="freeze"/></text><text x="26" y="166" class="mono" font-size="13.5"><tspan fill="#818cf8">&gt; </tspan><tspan fill="#e6edf3">RAG: vector search, grounded answers with sources</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" dur="1.10s" fill="freeze"/></text><text x="26" y="190" class="mono" font-size="13.5"><tspan fill="#818cf8">&gt; </tspan><tspan fill="#e6edf3">GenAI in production: guardrails, human approval steps, spend caps</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.769;1" dur="1.30s" fill="freeze"/></text><text x="26" y="214" class="mono" font-size="13.5"><tspan fill="#818cf8">&gt; </tspan><tspan fill="#e6edf3">Cloud: AWS (Bedrock, Terraform, OIDC), Google Cloud (Cloud Run, Vertex AI)</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.800;1" dur="1.50s" fill="freeze"/></text><text x="26" y="238" class="mono" font-size="13.5"><tspan fill="#2dd4bf">jugal@tokyo</tspan><tspan fill="#8d96a0"> ~ $ </tspan><tspan fill="#e6edf3" font-weight="700">cat background.txt</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.824;1" dur="1.70s" fill="freeze"/></text><text x="26" y="262" class="mono" font-size="13.5"><tspan fill="#e6edf3">MSc Computer Science (India) and MSc IT (Kyoto).</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" dur="1.90s" fill="freeze"/></text><text x="26" y="286" class="mono" font-size="13.5"><tspan fill="#e6edf3">Before AI: Python data engineering, Flask backends, technical training.</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.857;1" dur="2.10s" fill="freeze"/></text><text x="26" y="310" class="mono" font-size="13.5"><tspan fill="#2dd4bf">jugal@tokyo</tspan><tspan fill="#8d96a0"> ~ $ </tspan><tspan fill="#e6edf3" font-weight="700">cat certs.txt</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.870;1" dur="2.30s" fill="freeze"/></text><text x="26" y="334" class="mono" font-size="13.5"><tspan fill="#e6edf3">Microsoft Azure Fundamentals (AZ-900)  |  JLPT N3</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.880;1" dur="2.50s" fill="freeze"/></text><text x="26" y="358" class="mono" font-size="13.5"><tspan fill="#2dd4bf">jugal@tokyo</tspan><tspan fill="#8d96a0"> ~ $ </tspan><tspan fill="#e6edf3" font-weight="700">cat languages.txt</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.889;1" dur="2.70s" fill="freeze"/></text><text x="26" y="382" class="mono" font-size="13.5"><tspan fill="#e6edf3">English (fluent)  |  Japanese (business level)  |  Malayalam (native)</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.897;1" dur="2.90s" fill="freeze"/></text>

</svg>
